<!DOCTYPE html>
<html lang="ko">

<head>

    <style>
        @font-face {
            font-family: 'KoddiUDOnGothic';
            src: url('fonts/KoddiUDOnGothic-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'KoddiUDOnGothic';
            src: url('fonts/KoddiUDOnGothic-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        :root {
            --bg: #005c50;
            --panel: #000037;
            --frame: #ce5200;
            --btn: #a0a0d7;
            --btn-down: #8c8cc4;
            --btn-hi: #ffffff;
            --btn-lo: #7878af;
            --text: #ffffff;
            --dim: #a0a0d7;
            --faint: #6d6da0;
            --gold: #ffbd10;
            --yellow: #ffe800;
            --row-line: #141450;
            --sel: #1c1c6e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px 16px 40px;
            background: var(--bg);
            color: var(--text);
            font-family: 'KoddiUDOnGothic', system-ui, sans-serif;
            line-height: 1.55;
            word-break: keep-all;
        }

        .wrap { max-width: 1040px; margin: 0 auto; }

        .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .head .title { margin: 0; font-size: 22px; font-weight: 800; }
        .head .back { margin-left: auto; font-size: 13px; }
        .head .back a { color: var(--text); text-decoration: underline dotted; text-underline-offset: 3px; }
        .head .back a:hover { color: var(--yellow); }

        .layout { display: flex; gap: 18px; align-items: flex-start; margin-top: 16px; }
        .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
        .col.left { flex: 0 0 320px; }
        .col.right { flex: 1 1 0; }
        .col-panel { height: 540px; display: flex; flex-direction: column; min-height: 0; padding: 6px; }
        .divider { border-top: 2px solid var(--frame); margin: 0 2px; flex-shrink: 0; }

        .panel {
            background:
                url('assets/ui/frame/corner-lefttop.png') left top no-repeat,
                url('assets/ui/frame/corner-righttop.png') right top no-repeat,
                url('assets/ui/frame/corner-leftbottom.png') left bottom no-repeat,
                url('assets/ui/frame/corner-rightbottom.png') right bottom no-repeat,
                url('assets/ui/frame/line-top.png') left top repeat-x,
                url('assets/ui/frame/line-bottom.png') left bottom repeat-x,
                url('assets/ui/frame/line-left.png') left top repeat-y,
                url('assets/ui/frame/line-right.png') right top repeat-y,
                var(--panel);
            image-rendering: pixelated;
            padding: 8px;
        }

        .toolrow { display: flex; align-items: center; gap: 6px; flex-shrink: 0; height: 30px; }
        .toolrow .spacer { flex: 1; }
        .btn {
            font: inherit; font-size: 12.5px; font-weight: 700; color: #000; cursor: pointer;
            background: var(--btn); padding: 4px 12px;
            border: 2px solid; border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
        }
        .btn:hover { background: #b0b0e0; }
        .btn.on, .btn:active { background: var(--btn-down); border-color: var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo); }
        .sortbar .btn { flex: 1; font-size: 11.5px; padding: 4px 0; }
        .count-badge { font-size: 13px; font-weight: 700; color: var(--text); padding-left: 2px; }
        .count-badge.good { color: var(--yellow); }

        .hand-area { padding: 14px 6px 6px; flex-shrink: 0; }
        .hand { display: grid; grid-template-columns: repeat(6, 44px); grid-template-rows: repeat(2, 57px); justify-content: center; gap: 2px; height: 116px; }
        .tile-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 2px; cursor: pointer; background: transparent; border: 1px solid transparent;
        }
        .tile-btn:hover { border-color: var(--yellow); }
        .tile-btn img { width: 40px; height: 53px; }
        .tile-btn.disabled { opacity: 0.25; pointer-events: none; }
        .hand .tile-btn { transition: transform 0.08s, opacity 0.08s; }
        .hand.marking .tile-btn { opacity: 0.35; }
        .hand .tile-btn.use { transform: translateY(-10px); opacity: 1; }
        .hand-empty { grid-column: 1 / -1; grid-row: 1 / -1; color: var(--dim); font-size: 12px; text-align: center; align-self: center; }
        .hint { font-size: 11.5px; color: var(--dim); margin-top: 8px; text-align: center; }

        .palette-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 6px; }
        .palette { display: grid; grid-template-columns: repeat(4, 46px); grid-auto-rows: 59px; gap: 2px 0; align-items: center; justify-items: center; }
        .palette .tile-btn.purple { grid-column: 4; }

        .winner { padding: 10px 10px 8px; flex-shrink: 0; min-height: 86px; }
        .winner .label { font-size: 12px; font-weight: 700; color: var(--dim); }
        .winner .yk { font-size: 22px; font-weight: 800; color: var(--gold); line-height: 1.2; margin-top: 1px; }
        .winner .sc { font-size: 13px; margin-top: 3px; }
        .winner .penalty { font-size: 12px; color: var(--dim); margin-top: 2px; }
        .winner.none .yk { font-size: 15px; color: var(--dim); font-weight: 700; }

        .list { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
        .list::-webkit-scrollbar { width: 6px; }
        .list::-webkit-scrollbar-track { background: transparent; }
        .list::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
        .list::-webkit-scrollbar-thumb:hover { background: var(--dim); }
        .row { padding: 0 8px; border-bottom: 1px solid var(--row-line); cursor: pointer; color: var(--dim); }
        .row:hover { background: #0c0c4a; }
        .row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--yellow); }
        .row.tenpai { color: var(--text); }
        .row.win { color: var(--gold); }
        .row-head { display: flex; align-items: center; gap: 6px; height: 30px; font-size: 12.5px; }
        .r-group { width: 44px; text-align: center; font-size: 11px; font-weight: 700; border: 1px solid var(--faint); flex-shrink: 0; }
        .row.tenpai .r-group { border-color: var(--text); }
        .row.win .r-group { border-color: var(--gold); }
        .r-name { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r-base { color: var(--dim); font-weight: 400; font-size: 11px; }
        .r-tag { font-size: 10px; font-weight: 700; color: #000; background: var(--gold); padding: 0 6px; flex-shrink: 0; }
        .r-state { margin-left: auto; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
        .r-score { font-size: 11.5px; flex-shrink: 0; min-width: 44px; text-align: right; }
        .r-rule { display: none; color: var(--dim); font-size: 12px; padding: 0 0 8px 50px; }
        .row.sel .r-rule { display: block; }

        @media (max-width: 720px) {
            body { padding: 14px 12px 30px; }
            .head .title { font-size: 19px; }
            .layout { flex-direction: column; align-items: stretch; gap: 14px; }
            .col.left, .col.right { flex: none; }
            .col-panel { flex-shrink: 0; }
            .col.left .col-panel { height: auto; }
            .col.right .col-panel { height: 480px; }
            .full .palette-area, .full .palette-divider { display: none; }
        }

        /* 게임 옆 패널(380x480) */
        body.live { padding: 0; overflow: hidden; }
        .live .wrap { display: none; }
        #live { display: none; }
        .live #live {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; gap: 6px;
            padding: calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
        }
        .live-main { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; padding: 6px; }
        .live-main .list { flex: 1 1 0; min-height: 0; }
        .detail { padding: 6px 8px; font-size: 12px; min-height: 104px; flex-shrink: 0; border-top: 2px solid var(--frame); }
        .detail .d-head { display: flex; align-items: baseline; gap: 8px; }
        .detail .d-name { font-size: 14px; font-weight: 800; color: var(--gold); }
        .detail .d-score { margin-left: auto; color: var(--dim); font-weight: 700; }
        .detail .d-rule { color: var(--dim); margin-top: 1px; }
        .detail .d-need { display: flex; align-items: center; gap: 4px; margin-top: 5px; min-height: 30px; flex-wrap: wrap; }
        .detail .d-need .lb { color: var(--dim); font-size: 11px; font-weight: 700; margin-right: 2px; }
        .detail .d-need img { width: 20px; height: 27px; }
        .detail .d-need .done { color: var(--yellow); font-weight: 700; }
        .ex-tiles { display: flex; gap: 1px; margin-top: 5px; }
        .ex-tiles img, .ex-tiles .any { width: 20px; height: 27px; }
        .ex-tiles .any { border: 1px dashed var(--faint); font-size: 10px; color: var(--dim); display: flex; align-items: center; justify-content: center; }
        .handbar { display: flex; align-items: flex-end; gap: 1px; padding: 12px 2px 0; height: 56px; flex-shrink: 0; }
        .handbar img { width: 27px; height: 36px; opacity: 0.35; transition: transform 0.08s, opacity 0.08s; }
        .handbar img.use { transform: translateY(-10px); opacity: 1; }
        .handbar .open { display: flex; gap: 1px; margin-left: 6px; padding-left: 6px; border-left: 1px solid var(--dim); }
        .handbar .msg { color: var(--text); font-size: 12px; align-self: center; }

    </style>

<body>
    <div class="wrap">
        <div class="head">
            <h1 class="title">환세패유기 역 계산기</h1>
            <div class="back"><a href="https://atah.io/haiyuki_manual/index.html">← 해설서로 돌아가기</a></div>
        </div>

        <div class="layout">
            <div class="col left">
                <div class="toolrow">
                    <span class="count-badge" id="count">손패 0 / 12</span>
                    <span class="spacer"></span>
                    <button class="btn" id="dealRandom">랜덤 12장</button>
                    <button class="btn" id="clear">비우기</button>
                </div>
                <div class="panel col-panel">
                    <div class="hand-area">
                        <div class="hand" id="hand"></div>
                        <div class="hint">손패의 패를 클릭하면 제거됩니다.<br>역을 고르면 그 역에 쓰이는 패만 올라갑니다.</div>
                    </div>
                    <div class="divider palette-divider"></div>
                    <div class="palette-area">
                        <div class="palette" id="palette"></div>
                    </div>
                </div>
            </div>
            <div class="col right">
                <div class="toolrow sortbar" id="sortbarTester">
                    <button class="btn" data-sort="easy">맞추기 쉬운 순</button>
                    <button class="btn" data-sort="desc">점수 높은 순</button>
                    <button class="btn" data-sort="asc">점수 낮은 순</button>
                </div>
                <div class="panel col-panel">
                    <div class="winner" id="winner"></div>
                    <div class="divider"></div>
                    <div class="list" id="yakuRows"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="live">
        <div class="toolrow sortbar" id="sortbar">
            <button class="btn" data-sort="easy">맞추기 쉬운 순</button>
            <button class="btn" data-sort="desc">점수 높은 순</button>
            <button class="btn" data-sort="asc">점수 낮은 순</button>
        </div>
        <div class="live-main panel">
            <div class="list" id="liveList"></div>
            <div class="detail" id="liveDetail"></div>
        </div>
        <div class="handbar" id="liveHand"></div>
    </div>

    <script src="js/data/paiData.js"></script>
    <script src="js/data/battleConfig.js"></script>
    <script src="js/logic/yakuLogic.js"></script>
    <script src="js/logic/yakuDistance.js"></script>
    <script>
        const RULES = {
            IP_E_DAM: '뭐든지 1종류의 패를 9개 모은다. (아무 거나 3개씩 1벌 더)',
            BI_O_UI: '같은 색의 캐릭터 패 8개와 무기 패 4개를 모은다.',
            O_UI: '같은 색의 캐릭터패와 무기패를 6장씩 모은다.',
            JIN_MAYU: '빨강·노랑·파랑의 눈썹개패를 4장씩 모은다.',
            CROSS_COMBINATION: '같은 색의 캐릭터패 2종류와 무기패를 4장씩 모은다.',
            MAGU_DDAERIGI: '무기패를 4개씩 3벌 모은다.',
            PAL_BO_CHAE: '뭐든지 1종류의 패를 8개 모은다. (아무 거나 4개씩 1벌 더)',
            SPECIAL_COMBINATION: '같은 색으로 4종류를 3개씩 모은다.',
            CHO_IL_SAEK: '같은 색의 패를 4개씩 모은다.',
            PO_MUL_JANG: '포물장의 캐릭터 3인(화린, 스마슈, 유리와카마루)을 4개씩 모은다.',
            CHWI_HO_JEON: '취호전의 캐릭터 3인(아타호, 린샹, 스마슈)을 4개씩 모은다.',
            NAM_TANG: '남성 캐릭터패 3종류를 4개씩 모은다.',
            YEO_TANG: '여성 캐릭터패 3종류를 4개씩 모은다.',
            JU_HO: '아타호와 페톰을 6개씩 모은다.',
            CHO_MAYU: '눈썹개패를 3장씩, 4색을 모은다.',
            BYEON_TAE_GAE: '스마슈와 여성 캐릭터패 3종류를 3개씩 모은다.',
            JAYU_BAKAE_PYEONGDEUNG: '4색 가운데 3색에서 한 종류씩 4장을 모은다. 보라색 눈썹개도 한 색으로 센다.',
            SUN_IL_SAEK: '같은 색 패만으로 2종류를 3개씩, 다른 1종류는 6개 모은다.',
            PIL_SAL_GI: '같은 색의 캐릭터패 1종류와 무기패를 4개씩 모은다. (아무 거나 4개씩 1벌 더)',
            YUK_BEOP_JEON_SEO: '2종류의 패를 6개씩 모은다.',
            MAYU: '빨강·노랑·파랑의 눈썹개패를 3개씩 모은다. (아무 거나 3개씩 1벌 더)',
            IL_SAEK: '같은 색의 패로 3종류를 3개씩, 보라색 눈썹개패를 3개 모은다.',
            DOUBLE_COMBINATION: '캐릭터패와 무기패를 3개씩, 2색을 모은다.',
            COMBINATION: '같은 색의 캐릭터패 2종류와 무기패를 3개씩 모은다. (아무 거나 3개씩 1벌 더)',
            SAEK_HANA_SSIK: '4색의 패를 각각 3개씩 모은다.',
            SA_CHEON_YO_RI: '뭐든지 좋으니까 4개씩 모은다.',
            JANG_GI: '같은 색의 캐릭터패 한 종류와 무기패를 3개씩 모은다. (아무 거나 3개씩 2벌 더)',
            SAM_DO_RIP: '뭐든지 좋으니까 각각 3개씩 모두 4벌 모은다.',
            ALL_STARS: '눈썹개 이외의 모든 캐릭터 패를 2개씩 모은다.',
            SAM_YEON_GYEOK: '캐릭터패와 무기패를 2개씩, 3색을 모은다.'
        };

        const COLOR_ORDER = ['red', 'blue', 'yellow', 'purple'];
        const imgPath = (t) => 'assets/' + t.img;
        const tileById = (id) => PaiData.BY_ID[id];
        const toTile = (id) => { const t = tileById(id); return { type: t.id, color: t.color, img: t.img }; };
        const scoreOf = (key) => YakuLogic.SCORES[key];
        const BASE_NAMES = { IL_SAEK: '일색', CHO_IL_SAEK: '초 일색', SUN_IL_SAEK: '순 일색' };
        const baseName = (key) => BASE_NAMES[key] || YakuLogic.resolveYakuName(key, null, null);
        const nameOf = (r) => YakuLogic.resolveYakuName(r.key, r.meta, null);
        const nameHtml = (r) => {
            const base = baseName(r.key);
            const resolved = nameOf(r);
            return resolved !== base ? `${resolved} <span class="r-base">(${base})</span>` : base;
        };

        const params = new URLSearchParams(location.search);
        const LIVE = params.has('live');

        // ---------- 단독 페이지 ----------
        function setupTester() {
            let hand = [];
            let selected = -1;
            let sortMode = 'desc';

            const palette = document.getElementById('palette');
            COLOR_ORDER.flatMap(col => PaiData.TYPES.filter(t => t.color === col)).forEach(t => {
                const b = document.createElement('div');
                b.className = 'tile-btn' + (t.color === 'purple' ? ' purple' : '');
                b.dataset.tid = t.id;
                b.title = t.name;
                b.innerHTML = `<img src="${imgPath(t)}" alt="${t.name}">`;
                b.onclick = () => {
                    const used = hand.filter(x => x === t.id).length;
                    if (hand.length < 12 && used < PaiData.TILE_COUNT_PER_TYPE) { hand.push(t.id); render(); }
                };
                palette.appendChild(b);
            });

            document.getElementById('clear').onclick = () => { hand = []; render(); };
            document.getElementById('dealRandom').onclick = () => {
                hand = [];
                const ids = PaiData.TYPES.map(t => t.id);
                const used = {};
                while (hand.length < 12) {
                    const id = ids[Math.floor(Math.random() * ids.length)];
                    used[id] = (used[id] || 0);
                    if (used[id] < PaiData.TILE_COUNT_PER_TYPE) { used[id]++; hand.push(id); }
                }
                render();
            };

            const sortbar = document.getElementById('sortbarTester');
            sortbar.querySelectorAll('button').forEach(b => {
                b.classList.toggle('on', b.dataset.sort === sortMode);
                b.onclick = () => {
                    sortMode = b.dataset.sort;
                    sortbar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
                    render();
                };
            });

            function order(dist) {
                const idx = YakuDistance.YAKU.map((_, i) => i);
                const sc = (i) => scoreOf(YakuDistance.YAKU[i].key);
                if (sortMode === 'asc') return idx.sort((a, b) => sc(a) - sc(b) || a - b);
                if (sortMode === 'desc') return idx.sort((a, b) => sc(b) - sc(a) || a - b);
                return idx.sort((a, b) => dist[a].missing - dist[b].missing || sc(b) - sc(a) || a - b);
            }

            function render() {
                const sorted = [...hand].sort((a, b) => {
                    const ta = tileById(a), tb = tileById(b);
                    return COLOR_ORDER.indexOf(ta.color) - COLOR_ORDER.indexOf(tb.color) || ta.id.localeCompare(tb.id);
                });
                const tiles = sorted.map(toTile);
                const dist = YakuDistance.evaluate(tiles, []);

                const handEl = document.getElementById('hand');
                handEl.innerHTML = '';
                handEl.classList.toggle('marking', selected >= 0 && hand.length > 0);
                if (hand.length === 0) {
                    handEl.innerHTML = '<span class="hand-empty">아래에서 패를 골라 주세요.</span>';
                } else {
                    const marks = selected >= 0 ? YakuDistance.markSlots(dist[selected], tiles, []).hand : [];
                    sorted.forEach((id, idx) => {
                        const t = tileById(id);
                        const b = document.createElement('div');
                        b.className = 'tile-btn' + (marks[idx] ? ' use' : '');
                        b.title = `${t.name} · 클릭하면 제거`;
                        b.innerHTML = `<img src="${imgPath(t)}" alt="${t.name}">`;
                        b.onclick = () => { const i = hand.indexOf(id); if (i >= 0) { hand.splice(i, 1); render(); } };
                        handEl.appendChild(b);
                    });
                }
                const cnt = document.getElementById('count');
                cnt.textContent = `손패 ${hand.length} / 12`;
                cnt.className = 'count-badge ' + (hand.length === 12 ? 'good' : '');

                document.body.classList.toggle('full', hand.length === 12);
                document.querySelectorAll('#palette .tile-btn').forEach(b => {
                    const used = hand.filter(x => x === b.dataset.tid).length;
                    b.classList.toggle('disabled', hand.length >= 12 || used >= PaiData.TILE_COUNT_PER_TYPE);
                });

                const result = (hand.length === 12) ? YakuLogic.checkYaku(tiles, null) : null;
                const winnerName = result ? result.yaku[0] : null;
                let winnerMarked = false;

                const list = document.getElementById('yakuRows');
                list.innerHTML = '';
                order(dist).forEach(i => {
                    const r = dist[i];
                    const res = hand.length === 12 && r.missing === 0;
                    let isWin = false;
                    if (res && !winnerMarked && winnerName && nameOf(r) === winnerName) { isWin = true; winnerMarked = true; }
                    const state = hand.length === 0 ? '' : res ? '완성' : r.missing === 1 && hand.length >= 11 ? '텐파이' : r.missing + '장 부족';
                    const item = document.createElement('div');
                    item.className = 'row' + (res ? ' win' : (state === '텐파이' ? ' tenpai' : '')) + (i === selected ? ' sel' : '');
                    item.title = r.key;
                    item.onclick = () => { selected = (selected === i) ? -1 : i; render(); };
                    item.innerHTML =
                        `<div class="row-head">` +
                        `<span class="r-group">${YakuDistance.YAKU[i].group}개 역</span>` +
                        `<span class="r-name">${res ? nameHtml(r) : baseName(r.key)}</span>` +
                        (isWin ? `<span class="r-tag">최종</span>` : '') +
                        `<span class="r-state">${state}</span>` +
                        `<span class="r-score">${scoreOf(r.key)}</span>` +
                        `</div>` +
                        `<div class="r-rule">${RULES[r.key]}</div>`;
                    list.appendChild(item);
                });

                const w = document.getElementById('winner');
                if (hand.length !== 12) {
                    w.className = 'winner none';
                    w.innerHTML = `<div class="label">완성된 역</div><div class="yk">손패를 12장 만들어 주세요 (${hand.length}/12)</div>`;
                } else if (!result) {
                    w.className = 'winner none';
                    w.innerHTML = `<div class="label">완성된 역</div><div class="yk">역 없음 — 날 수 없습니다</div>
                        <div class="penalty">12장이지만 완성된 역이 없습니다.</div>`;
                } else {
                    w.className = 'winner';
                    const open = Math.round(result.score * 0.75);
                    w.innerHTML =
                        `<div class="label">완성된 역</div>` +
                        `<div class="yk">${result.yaku[0]}</div>` +
                        `<div class="sc">기본 ${result.score}점</div>` +
                        `<div class="penalty">펑을 해서 나면 3/4 → ${open}점</div>`;
                }
            }

            render();
        }

        // ---------- 게임 옆 패널 ----------
        function setupLive() {
            document.body.classList.add('live');
            const listEl = document.getElementById('liveList');
            const detailEl = document.getElementById('liveDetail');
            const handEl = document.getElementById('liveHand');
            const sortbar = document.getElementById('sortbar');

            let sortMode = 'easy';
            let selected = 0;
            let hand = [], openSets = [], dist = null, lastKey = null, hadHand = false, unseen = null, reach = null;

            const source = () => {
                try {
                    if (window.parent !== window && window.parent.__haiyuki__ !== undefined) return window.parent;
                    if (window.opener && window.opener.__haiyuki__ !== undefined) return window.opener;
                } catch (_) { }
                return null;
            };

            function order() {
                const idx = YakuDistance.YAKU.map((_, i) => i);
                const sc = (i) => scoreOf(YakuDistance.YAKU[i].key);
                if (sortMode === 'asc') return idx.sort((a, b) => sc(a) - sc(b) || a - b);
                if (sortMode === 'desc') return idx.sort((a, b) => sc(b) - sc(a) || a - b);
                return idx.sort((a, b) => dist[a].missing - dist[b].missing || sc(b) - sc(a) || a - b);
            }

            function renderList() {
                const rows = order();
                listEl.innerHTML = '';
                rows.forEach(i => {
                    const r = dist[i];
                    const row = document.createElement('div');
                    row.className = 'row' + (i === selected ? ' sel' : '') + (r.missing === 0 ? ' win' : r.missing === 1 ? ' tenpai' : '');
                    row.dataset.index = i;
                    const blocked = (YakuDistance.YAKU[i].closed && openSets.length > 0) || (reach && !reach[i]);
                    const state = !hand.length ? '' : blocked ? '완성 불가' : r.missing === 0 ? '완성' : r.missing === 1 ? '텐파이' : r.missing + '장 부족';
                    row.innerHTML =
                        `<div class="row-head">` +
                        `<span class="r-group">${YakuDistance.YAKU[i].group}개 역</span>` +
                        `<span class="r-name">${nameOf(r)}</span>` +
                        `<span class="r-state">${state}</span>` +
                        `<span class="r-score">${scoreOf(r.key)}</span>` +
                        `</div>`;
                    row.onclick = () => { selected = i; renderList(); renderDetail(); renderHand(); };
                    listEl.appendChild(row);
                });
                const sel = listEl.querySelector('.row.sel');
                if (sel) sel.scrollIntoView({ block: 'nearest' });
            }

            function tileImg(id, cls) {
                const t = tileById(id);
                return `<img src="${imgPath(t)}" alt="${t.name}" title="${t.name}"${cls ? ` class="${cls}"` : ''}>`;
            }

            function renderDetail() {
                const r = dist[selected];
                const y = YakuDistance.YAKU[selected];
                const ex = YakuDistance.exampleTiles(selected).map(id => id ? tileImg(id) : '<span class="any">?</span>').join('');
                let need = '';
                if (hand.length === 0) need = '';
                else if (r.missing === 0) need = '<span class="done">완성</span>';
                else {
                    const kinds = YakuDistance.helpfulKinds(hand, openSets, selected, unseen);
                    need = `<span class="lb">${r.missing}장 부족 · 필요한 패</span>` + kinds.map(id => tileImg(id)).join('');
                    if (y.closed && openSets.length) need = '<span class="lb">펑을 하면 완성할 수 없음</span>';
                    else if (reach && !reach[selected]) need = '<span class="lb">필요한 패가 더 남아 있지 않음</span>';
                }
                detailEl.innerHTML =
                    `<div class="d-head"><span class="d-name">${nameOf(r)}</span><span class="d-score">${scoreOf(y.key)}점</span></div>` +
                    `<div class="d-rule">${RULES[y.key]}</div>` +
                    `<div class="ex-tiles">${ex}</div>` +
                    `<div class="d-need">${need}</div>`;
            }

            function renderHand() {
                if (hand.length === 0) {
                    handEl.innerHTML = '<span class="msg">패를 받으면 손패가 여기에 표시됩니다.</span>';
                    return;
                }
                const mark = YakuDistance.markSlots(dist[selected], hand, openSets);
                let html = hand.map((t, i) => tileImg(t.type, mark.hand[i] ? 'use' : '')).join('');
                if (openSets.length) {
                    html += '<span class="open">' + openSets.map((s, i) => s.tiles.map(t => tileImg(t.type, mark.open[i] ? 'use' : '')).join('')).join('') + '</span>';
                }
                handEl.innerHTML = html;
            }

            function apply(rawHand, rawOpen, rawDiscards, rawCpuOpen) {
                let nh = [], no = [];
                const copySets = (sets) => (sets || []).map(s => ({ tiles: s.tiles.map(t => ({ type: t.type, color: t.color })) }));
                if (rawHand && rawHand.length >= 11 - 3 * (rawOpen || []).length) {
                    nh = rawHand.filter(t => t).map(t => ({ type: t.type, color: t.color }));
                    no = copySets(rawOpen);
                }
                const nd = (rawDiscards || []).filter(t => t).map(t => ({ type: t.type, color: t.color }));
                const nc = copySets(rawCpuOpen);
                const key = nh.map(t => t.type).join(',') + '|' + no.map(s => s.tiles[0].type).join(',') + '|' + nd.length + '|' + nc.length;
                if (key === lastKey) return;
                lastKey = key;
                hand = nh;
                openSets = no;
                dist = YakuDistance.evaluate(hand, openSets);
                unseen = hand.length ? YakuDistance.unseenCounts(hand, openSets, nd, nc) : null;
                reach = unseen ? YakuDistance.reachable(hand, openSets, unseen) : null;
                if (!hadHand && hand.length) { hadHand = true; selected = order()[0]; }
                renderList();
                renderDetail();
                renderHand();
            }

            sortbar.querySelectorAll('button').forEach(b => {
                b.classList.toggle('on', b.dataset.sort === sortMode);
                b.onclick = () => {
                    sortMode = b.dataset.sort;
                    sortbar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
                    renderList();
                };
            });

            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'haiyuki-hand') apply(e.data.hand, e.data.openSets, e.data.discards, e.data.cpuOpenSets);
            });

            function poll() {
                const src = source();
                if (!src) return;
                const snap = src.__haiyuki__;
                if (!snap || !snap.p1) { apply(null, null, null, null); return; }
                apply(snap.p1.hand, snap.p1.openSets, snap.board.discards, snap.cpu.openSets);
            }

            apply(null, null, null, null);
            poll();
            setInterval(poll, 200);
            const owner = (window.parent !== window) ? window.parent : window.opener;
            if (owner) { try { owner.postMessage({ type: 'haiyuki-hand-request' }, '*'); } catch (_) { } }
        }

        if (LIVE) setupLive(); else setupTester();
    </script>
