<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>VS MODE 로비 시안</title>
<style>
@font-face { font-family: 'KoddiUDOnGothic'; src: url('../fonts/KoddiUDOnGothic-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'KoddiUDOnGothic'; src: url('../fonts/KoddiUDOnGothic-Bold.woff2') format('woff2'); font-weight: 700; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #1a1a1a; color: #ccc; font-family: 'KoddiUDOnGothic', sans-serif; }
h2 { font-size: 14px; font-weight: 400; margin: 24px 0 8px; color: #999; }
.row { display: flex; gap: 20px; flex-wrap: wrap; }
.stage { position: relative; overflow: hidden; width: 640px; height: 480px; background: url('../assets/bg/STAFFBAK.png') center / 100% 100% no-repeat; box-shadow: 0 0 20px rgba(0,0,0,.5); container-type: inline-size; }
.stage.small { width: 360px; height: 270px; }

:root {
    /* 단위: 캔버스 폭 640 기준 1px */
    --ol-u: calc(100cqw / 640);

    /* 기존 정의 — haiyuki.css 페이지 토큰 */
    --border: rgba(255, 255, 255, 0.22);
    --text-2: rgba(170, 170, 170, 1);
    --surface-2: rgba(51, 51, 51, 1);
    --stage-toast: rgba(0, 0, 0, 0.7);
    --stage-btn-border: rgba(102, 102, 102, 1);
    --stage-text: rgba(238, 238, 238, 1);
    --stage-text-2: rgba(204, 204, 204, 1);
    /* 기존 정의 — yaku-calc.html(프레임 PNG·패 그림과 같은 값) */
    --frame: #ce5200;
    --gold: #ffbd10;
    --yellow: #ffe800;
    /* 기존 정의 — 게임 캔버스(UIDraw.drawWindow·drawButton) */
    --game-window-bg: rgba(0, 0, 0, 0.6);
    --game-select-text: rgba(255, 255, 0, 1);

    /* VS MODE 색: 위 정의를 가리킴 */
    --ol-text: #ffffff;
    --ol-text-dim: var(--text-2);
    --ol-accent: var(--game-select-text);
    --ol-window-bg: var(--game-window-bg);
    --ol-divider: var(--frame);
    --ol-primary: var(--gold);
    --ol-primary-hi: #ffffff;
    --ol-primary-lo: #de8c10;
    --ol-primary-hover: var(--yellow);
    --ol-secondary: #ffffff;
    --ol-secondary-hi: #ffffff;
    --ol-secondary-lo: var(--stage-btn-border);
    --ol-secondary-hover: var(--stage-text);
    --ol-secondary-down: var(--stage-text-2);
    --ol-field-bg: var(--surface-2);
    --ol-field-border: var(--stage-btn-border);
    --ol-control-text: #000000;

    /* 글자 크기 */
    --ol-glyph: calc(var(--ol-u) * 40);
    --ol-fs-code: calc(var(--ol-u) * 30);
    --ol-heading-gap: calc(var(--ol-u) * 21);
    --ol-fs-control: max(11px, calc(var(--ol-u) * 13));
    --ol-fs-body: calc(var(--ol-u) * 17);
    --ol-fs-list: calc(var(--ol-u) * 15);

    /* 컨트롤 */
    --ol-control-w: calc(var(--ol-u) * 154);
    --ol-control-h: max(24px, calc(var(--ol-u) * 28));
    --ol-bevel: 2px;
    --ol-divider-w: 2px;

    /* 창·간격 */
    --ol-frame: calc(var(--ol-u) * 14);
    --ol-window-w: calc(var(--ol-u) * 486);
    --ol-window-pad: calc(var(--ol-u) * 13);
    --ol-gap: calc(var(--ol-u) * 13);
    --ol-gap-sm: calc(var(--ol-u) * 13);
    --ol-toast-x: calc(var(--ol-u) * 13);
    --ol-toast-y: calc(var(--ol-u) * 48);
    --ol-toast-pad-x: calc(var(--ol-u) * 4);
    --ol-toast-pad-y: 0px;
    --ol-list-cols: calc(var(--ol-u) * 30) calc(var(--ol-u) * 51) 1fr calc(var(--ol-u) * 58);
}

.panel {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding: var(--ol-gap);
}
.window {
    width: var(--ol-window-w); max-width: 100%; max-height: 100%; overflow: hidden;
    padding: calc(var(--ol-frame) + var(--ol-window-pad));
    background:
        url('../assets/ui/frame/corner-lefttop.png') left top / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-righttop.png') right top / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-leftbottom.png') left bottom / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-rightbottom.png') right bottom / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/line-top.png') left top / var(--ol-u) var(--ol-frame) repeat-x,
        url('../assets/ui/frame/line-bottom.png') left bottom / var(--ol-u) var(--ol-frame) repeat-x,
        url('../assets/ui/frame/line-left.png') left top / var(--ol-frame) var(--ol-u) repeat-y,
        url('../assets/ui/frame/line-right.png') right top / var(--ol-frame) var(--ol-u) repeat-y,
        var(--ol-window-bg);
    image-rendering: pixelated;
    display: flex; flex-direction: column; align-items: center; gap: var(--ol-gap);
    color: var(--ol-text); text-align: center;
}
.note { margin: 0; font-size: var(--ol-fs-body); color: var(--ol-text-dim); }
.note.wait::after { content: '.'; display: inline-block; width: 1.2em; text-align: left; animation: ol-dots 1.5s steps(1, end) infinite; }
@keyframes ol-dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
.code { font-size: var(--ol-fs-code); font-weight: 700; letter-spacing: .25em; padding-left: .25em; color: var(--ol-text); line-height: 1.1; }
.glyph {
    width: calc(var(--ol-glyph) * var(--w, 32) / 32); height: var(--ol-glyph);
    background: url('../assets/ui/alphabet.png') no-repeat;
    background-size: calc(var(--ol-glyph) * 30) calc(var(--ol-glyph) * 2);
    background-position: calc(var(--ol-glyph) * -1 * (var(--i) + var(--off, 0) / 32)) calc(var(--ol-glyph) * -1 * var(--row, 1));
    image-rendering: pixelated;
}
.result, .heading { display: flex; margin: 0; }
.heading { margin: var(--ol-heading-gap) 0; }
.glyph.space { width: calc(var(--ol-glyph) / 2); background: none; }
.divider { width: 100%; margin: 0; border: 0; border-top: var(--ol-divider-w) solid var(--ol-divider); }
.hrow { display: flex; flex-wrap: wrap; gap: var(--ol-gap-sm); width: 100%; justify-content: center; align-items: stretch; }

.btn {
    min-width: var(--ol-control-w); height: var(--ol-control-h); padding: 0 1em; flex: none; white-space: nowrap;
    font: inherit; font-size: var(--ol-fs-control); font-weight: 700; color: var(--ol-control-text); cursor: pointer;
    background: var(--ol-primary);
    border: var(--ol-bevel) solid; border-color: var(--ol-primary-hi) var(--ol-primary-lo) var(--ol-primary-lo) var(--ol-primary-hi);
}
.btn:hover { background: var(--ol-primary-hover); }
.btn:active, .btn.down { background: var(--ol-primary-lo); border-color: var(--ol-primary-lo) var(--ol-primary-hi) var(--ol-primary-hi) var(--ol-primary-lo); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sub { background: var(--ol-secondary); border-color: var(--ol-secondary-hi) var(--ol-secondary-lo) var(--ol-secondary-lo) var(--ol-secondary-hi); }
.btn.sub:hover { background: var(--ol-secondary-hover); }
.btn.sub:active, .btn.sub.down { background: var(--ol-secondary-down); border-color: var(--ol-secondary-lo) var(--ol-secondary-hi) var(--ol-secondary-hi) var(--ol-secondary-lo); }

.input {
    height: var(--ol-control-h); padding: 0 var(--ol-gap-sm);
    font: inherit; font-size: var(--ol-fs-control); font-weight: 700; color: var(--ol-text);
    background: var(--ol-field-bg); border: var(--ol-bevel) solid var(--ol-field-border); outline: none; border-radius: 0;
}
.input:focus { border-color: var(--ol-accent); }
.input::placeholder { color: var(--ol-text-dim); letter-spacing: 0; font-weight: 400; }
.input.code-in { width: max(var(--ol-control-w), 6.6em); text-align: center; text-transform: uppercase; letter-spacing: .3em; padding-left: calc(var(--ol-gap-sm) + .3em); }

.history { width: 100%; margin: 0; padding: 0 var(--ol-gap-sm) 0 0; list-style: none; font-size: var(--ol-fs-list); line-height: 1.4; text-align: left; max-height: calc(var(--ol-fs-list) * 1.4 * 7); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ol-text-dim) transparent; }
.history li { display: grid; grid-template-columns: var(--ol-list-cols); gap: var(--ol-gap-sm); align-items: baseline; white-space: nowrap; }
.history li > :nth-child(3) { overflow: hidden; text-overflow: ellipsis; }
.history .r { color: var(--ol-text-dim); }
.history .w { font-weight: 700; color: var(--ol-accent); }
.history .l { font-weight: 700; }
.history .d { color: var(--ol-text-dim); }
.history .dmg { text-align: right; }

.toast {
    position: absolute; left: var(--ol-toast-x); top: var(--ol-toast-y); z-index: 6;
    padding: calc(var(--ol-frame) + var(--ol-toast-pad-y)) calc(var(--ol-frame) + var(--ol-toast-pad-x));
    font-size: var(--ol-fs-body); color: var(--ol-text); white-space: nowrap;
    background:
        url('../assets/ui/frame/corner-lefttop.png') left top / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-righttop.png') right top / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-leftbottom.png') left bottom / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/corner-rightbottom.png') right bottom / var(--ol-frame) var(--ol-frame) no-repeat,
        url('../assets/ui/frame/line-top.png') left top / var(--ol-u) var(--ol-frame) repeat-x,
        url('../assets/ui/frame/line-bottom.png') left bottom / var(--ol-u) var(--ol-frame) repeat-x,
        url('../assets/ui/frame/line-left.png') left top / var(--ol-frame) var(--ol-u) repeat-y,
        url('../assets/ui/frame/line-right.png') right top / var(--ol-frame) var(--ol-u) repeat-y,
        var(--ol-window-bg);
    image-rendering: pixelated;
}
</style>
</head>
<body>
<div id="screens"></div>
<script>
const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ?.,!";
const GLYPH = { I: { w: 24, off: 4 } };
const SHOT = n => `style="background: url('visual.spec.ts-snapshots/${n}-chromium-darwin.png') center / 100% 100% no-repeat;"`;

function glyphs(word, row) {
    return [...word].map(c => {
        if (c === ' ') return '<span class="glyph space"></span>';
        const g = GLYPH[c] || {};
        const vars = [`--i:${A.indexOf(c)}`, g.w ? `--w:${g.w}` : '', g.off ? `--off:${g.off}` : '', row != null ? `--row:${row}` : ''].filter(Boolean).join('; ');
        return `<span class="glyph" style="${vars}"></span>`;
    }).join('');
}

const LABEL = { win: '승', lose: '패', draw: '무승부' };
const CLS = { win: 'w', lose: 'l', draw: 'd' };
function historyRows(rounds) {
    const T = t => t ? '텐파이' : '노텐';
    return rounds.map(r => {
        const detail = r.result === 'draw' ? `${T(r.tenpai[0])} / ${T(r.tenpai[1])}` : r.yaku;
        const dmg = r.damage ? '-' + r.damage : '';
        return `<li><span class="r">R${r.round}</span><span class="${CLS[r.result]}">${LABEL[r.result]}</span><span>${detail}</span><span class="dmg">${dmg}</span></li>`;
    }).join('');
}

function render(st) {
    const toast = st.toast ? `<div class="toast">${st.toast}</div>` : '';
    if (st.view === 'battle' || st.view === 'select') return toast;
    let inner = '';
    if (st.view === 'start') {
        inner = `<h1 class="heading" aria-label="VS MODE">${glyphs('VS MODE', 1)}</h1>
      <button class="btn">방 만들기</button>
      <hr class="divider">
      <div class="hrow"><input class="input code-in" placeholder="방 코드" value="${st.code || ''}"><button class="btn">참가</button></div>`;
    } else if (st.view === 'wait') {
        inner = `<h1 class="heading" aria-label="VS MODE">${glyphs('VS MODE', 1)}</h1>
      <div class="code">${st.code}</div>
      ${st.role === 'host' ? '<div class="hrow"><button class="btn">코드 복사</button><button class="btn">바로 입장 링크 복사</button></div>' : ''}
      <p class="note wait">상대를 기다리는 중</p>
      <button class="btn sub">취소</button>`;
    } else if (st.view === 'ended') {
        const won = st.result === 'win';
        const rematch = st.canRematch
            ? (st.rematch === 'waiting'
                ? '<p class="note wait">상대를 기다리는 중</p>'
                : '<button class="btn">다시 대전</button>')
            : '<p class="note">상대가 나갔습니다</p>';
        inner = `<div class="result ${won ? 'win' : 'lose'}" aria-label="${won ? 'WIN' : 'LOSE'}">${glyphs(won ? 'WIN' : 'LOSE', 0)}</div>
      <ul class="history">${historyRows(st.rounds)}</ul>
      ${rematch}
      <button class="btn sub">나가기</button>`;
    }
    return `${toast}<div class="panel"><div class="window">${inner}</div></div>`;
}

const ROUNDS = [
    { round: 1, result: 'win', yaku: '삼도립', damage: 2400 },
    { round: 2, result: 'draw', tenpai: [true, false], damage: 1000 },
    { round: 3, result: 'lose', yaku: '적일색', damage: 3600 },
    { round: 4, result: 'win', yaku: '취호전 · 도라 3', damage: 7200 },
];
const WORST = [
    { round: 1, result: 'lose', yaku: '입에 담을 수도 없는 엄청난 기술 · 도라 3', damage: 14400 },
    { round: 2, result: 'win', yaku: '입에 담을 수도 없는 엄청난 기술', damage: 9600 },
    { round: 3, result: 'draw', tenpai: [true, true], damage: 0 },
];
const flip = rs => rs.map(r => ({ ...r, result: r.result === 'win' ? 'lose' : r.result === 'lose' ? 'win' : 'draw' }));
const LONG = Array.from({ length: 12 }, (_, i) => ROUNDS[i % 4] ? { ...ROUNDS[i % 4], round: i + 1 } : null);

const SCREENS = [
    ['시작', { view: 'start' }],
    ['시작 — 로비·캐릭터 선택 중 끊김 뒤(입력은 비움)', { view: 'start', toast: '연결이 끊어졌습니다' }],
    ['대기 — 호스트', { view: 'wait', role: 'host', code: 'ABCDE' }],
    ['대기 — 코드 복사 직후', { view: 'wait', role: 'host', code: 'ABCDE', toast: '코드를 복사했습니다' }],
    ['대기 — 링크 복사 직후', { view: 'wait', role: 'host', code: 'ABCDE', toast: '바로 입장 링크를 복사했습니다' }],
    ['대기 — 게스트', { view: 'wait', role: 'guest', code: 'ABCDE' }],
    ['캐릭터 선택 — 상대 접속 직후(패널은 닫힘)', { view: 'select', toast: '상대가 들어왔습니다' }],
    ['캐릭터 선택 — 내가 먼저 고름', { view: 'select', toast: '상대가 캐릭터를 고르는 중' }],
    ['매치 끝 — 승리, 둘 다 아직 안 누름', { view: 'ended', result: 'win', rounds: ROUNDS, canRematch: true, rematch: 'idle' }],
    ['매치 끝 — 내가 다시 대전을 누름', { view: 'ended', result: 'win', rounds: ROUNDS, canRematch: true, rematch: 'waiting' }],
    ['매치 끝 — 상대가 먼저 누름(내 버튼은 그대로)', { view: 'ended', result: 'lose', rounds: flip(ROUNDS), canRematch: true, rematch: 'idle', toast: '상대가 다시 대전을 원합니다' }],
    ['매치 끝 — 상대가 나가서 CPU와 끝낸 뒤(재대전 없음)', { view: 'ended', result: 'lose', rounds: flip(LONG), canRematch: false }],
    ['매치 끝 — 가장 긴 역 이름', { view: 'ended', result: 'lose', rounds: WORST, canRematch: true, rematch: 'idle' }],
    ['전투 중 토스트', { view: 'battle', toast: '상대가 나가서 CPU가 이어받습니다' }],
];

const root = document.getElementById('screens');
root.innerHTML = SCREENS.map(([title, st]) => {
    const bg = st.view === 'battle' ? SHOT('battle-player-turn') : st.view === 'select' ? SHOT('charselect') : '';
    const html = render(st);
    return `<h2>${title}</h2><div class="row"><div class="stage" ${bg}>${html}</div><div class="stage small" ${bg}>${html}</div></div>`;
}).join('');
document.querySelectorAll('.history').forEach(ul => { ul.scrollTop = ul.scrollHeight; });
</script>

</body>
</html>
